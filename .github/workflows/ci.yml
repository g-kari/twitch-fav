name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run package
      - name: Verify ZIP with an independent parser
        shell: python
        run: |
          import zipfile, json
          with zipfile.ZipFile('artifacts/twitch-favorites-v1.0.1.zip') as z:
            assert z.testzip() is None
            assert len(z.namelist()) == 14
            assert json.loads(z.read('manifest.json'))['version'] == '1.0.1'
      - name: Offline Chrome fixtures
        if: runner.os == 'Linux'
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: artifacts/
